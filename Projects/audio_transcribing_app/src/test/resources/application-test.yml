spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///transcription_db_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  whisper:
    base-url: http://localhost:9999
    model: tiny
    request-timeout: 30s
  storage:
    work-directory: /tmp/transcriptions-test
  ffmpeg:
    executable-path: ffmpeg
    ffprobe-path: ffprobe
    chunk-duration-seconds: 600
  processing:
    max-retries: 1
    retry-delay: 100ms
    chunk-timeout: 5m
  upload:
    max-file-size-bytes: 104857600

logging:
  level:
    root: WARN
    com.transcription.app: INFO
