spring:
  application:
    name: audio-transcribing-app

  # Virtual Threads — Project Loom (Java 21)
  threads:
    virtual:
      enabled: true

  # Database
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transcription_db}
    username: ${DB_USER:transcription_user}
    password: ${DB_PASSWORD:transcription_pass}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  # Flyway database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Multipart — large file support
  servlet:
    multipart:
      enabled: true
      max-file-size: 10GB
      max-request-size: 10GB
      file-size-threshold: 10MB  # Start streaming to disk above this threshold

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: NON_NULL

# Server
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1        # No limit on request body size
    max-http-form-post-size: -1 # No limit on form post size
    connection-timeout: 60000
  compression:
    enabled: true
    mime-types: application/json,text/plain

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging
logging:
  level:
    root: INFO
    com.transcription.app: DEBUG
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{jobId}] %-5level %logger{36} - %msg%n"

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

# Application custom properties
app:
  upload:
    max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:10737418240}  # 10 GB
    allowed-content-type: audio/mpeg

  processing:
    max-retries: ${MAX_RETRIES:3}
    retry-delay: ${RETRY_DELAY:5s}
    chunk-timeout: ${CHUNK_TIMEOUT:30m}
    max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:5}

  ffmpeg:
    executable-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    chunk-duration-seconds: ${CHUNK_DURATION_SECONDS:600}  # 10 minutes

  whisper:
    base-url: ${WHISPER_URL:http://whisper-service:8000}
    model: ${WHISPER_MODEL:medium}
    language: ${WHISPER_LANGUAGE:}  # empty = auto-detect
    request-timeout: ${WHISPER_TIMEOUT:20m}

  storage:
    work-directory: ${WORK_DIR:/app/transcriptions}
    cleanup-on-completion: ${CLEANUP_ON_COMPLETION:false}
    retention-period: ${RETENTION_PERIOD:7d}
    input-directory: ${INPUT_DIR:}
    output-directory: ${OUTPUT_DIR:}

---
# Local development profile
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:5432/transcription_db
    username: transcription_user
    password: transcription_pass

app:
  whisper:
    base-url: http://localhost:8000
  storage:
    work-directory: /tmp/transcriptions
  ffmpeg:
    executable-path: ffmpeg
    ffprobe-path: ffprobe

logging:
  level:
    com.transcription.app: DEBUG
    org.springframework.web: DEBUG
